apiVersion: v1
kind: ConfigMap
metadata:
  name: pinnacle-a2a-config
  namespace: pinnacle-core
data:
  A2A_REGISTRY_URL: "https://registry.agentplatform.google.com"
  # Anticipated Building Occupancy optimization scenario (A2A Protocol specification)
  A2A_CAPABILITIES: |
    {
      "protocols": ["a2a-occupancy-v1", "a2a-energy-v1", "a2a-strategy-v2"],
      "grounding_sources": ["vertex-ai-search", "google-search"],
      "allowed_collaborator_agents": [
        "hr-agent.internal.enterprise.com",
        "facilities-agent.internal.enterprise.com"
      ]
    }
